[package]
name = 'uuidx'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.81'

[lib]
crate-type = [ 'staticlib' ]
name = 'uuidx'

[dependencies]
extendr-api = { path = 'vendor-patched/extendr-api' }
uuid = { version = '=1.12.1', features = ['rng', 'std', 'v1', 'v4', 'v5', 'v6', 'v7'] }
